                <canvas id="splash-ring-canvas" width="80" height="80" style="position:absolute; inset:0; width:80px; height:80px;"></canvas>
                <span id="splash-percent-text" style="color:#FFFFFF; font-size:13px; font-weight:600;">0%</span>
              </div>
              <div style="height:16px;"></div>
              <div style="color:rgba(229,9,20,0.85); font-size:11px; letter-spacing:3px; font-weight:500;">LOADING EXPERIENCE...</div>
            </div>
          </div>
        `;
      },

      drawSafeRoundedRect(ctx, x, y, w, h, r) {
        const rad = Math.max(0, Math.min(r, w / 2, h / 2));
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.lineTo(x + w - rad, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
        ctx.lineTo(x + w, y + h - rad);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
        ctx.lineTo(x + rad, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
        ctx.lineTo(x, y + rad);
        ctx.quadraticCurveTo(x, y, x + rad, y);
        ctx.closePath();
      },

      drawTvLogo(ctx, w, h) {
        try {
          ctx.clearRect(0, 0, w, h);
          const dashColors = ['#FF505B', '#E50914', 'rgba(229,9,20,0.6)', 'rgba(229,9,20,0.3)'];
          const dashLengths = [w * 0.25, w * 0.20, w * 0.15, w * 0.10];
          const dashOffsets = [h * 0.40, h * 0.50, h * 0.60, h * 0.70];

          dashColors.forEach((col, idx) => {
            ctx.fillStyle = col;
            this.drawSafeRoundedRect(ctx, w * 0.08, dashOffsets[idx] - 3, dashLengths[idx], 4, 2);
            ctx.fill();
          });

          const bodyLeft = w * 0.35;
          const bodyTop = h * 0.25;
          const bodyWidth = w * 0.55;
          const bodyHeight = h * 0.50;
          const bodyCorner = 16;

          const borderGrad = ctx.createLinearGradient(bodyLeft, bodyTop, bodyLeft + bodyWidth, bodyTop + bodyHeight);
          borderGrad.addColorStop(0, '#FF505B');
          borderGrad.addColorStop(1, '#E50914');
          ctx.fillStyle = borderGrad;
          this.drawSafeRoundedRect(ctx, bodyLeft - 3, bodyTop - 3, bodyWidth + 6, bodyHeight + 6, bodyCorner + 3);
          ctx.fill();

          ctx.fillStyle = '#0D0008';
          this.drawSafeRoundedRect(ctx, bodyLeft, bodyTop, bodyWidth, bodyHeight, bodyCorner);
          ctx.fill();

          const antennaCx = bodyLeft + bodyWidth * 0.4;
          ctx.strokeStyle = '#FF505B';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(antennaCx - 10, bodyTop - 2);
          ctx.lineTo(antennaCx - 22, bodyTop - 18);
          ctx.moveTo(antennaCx + 10, bodyTop - 2);
          ctx.lineTo(antennaCx + 22, bodyTop - 18);
          ctx.stroke();

          ctx.fillStyle = '#FF505B';
          ctx.beginPath();
          ctx.arc(antennaCx - 22, bodyTop - 18, 4, 0, Math.PI * 2);
          ctx.arc(antennaCx + 22, bodyTop - 18, 4, 0, Math.PI * 2);
          ctx.fill();

          const triCx = bodyLeft + bodyWidth / 2;
          const triCy = bodyTop + bodyHeight / 2;
          const triSize = bodyHeight * 0.3;
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.moveTo(triCx - triSize * 0.5, triCy - triSize * 0.6);
          ctx.lineTo(triCx + triSize * 0.7, triCy);
          ctx.lineTo(triCx - triSize * 0.5, triCy + triSize * 0.6);
          ctx.closePath();
          ctx.fill();
        } catch (e) {}
      },

      start(onFinished) {
        if (this.animFrame) cancelAnimationFrame(this.animFrame);
        if (this.safetyTimer) clearTimeout(this.safetyTimer);

        let completed = false;
        const completeSplash = () => {
          if (completed) return;
          completed = true;
          if (this.animFrame) { cancelAnimationFrame(this.animFrame); this.animFrame = null; }
          if (this.safetyTimer) { clearTimeout(this.safetyTimer); this.safetyTimer = null; }
          this.finishNow = null;
          onFinished();
        };
        this.finishNow = completeSplash;

        // Hard safety timeout so Samsung TV never gets stuck on Splash even if rAF is throttled
        this.safetyTimer = setTimeout(completeSplash, this.durationMs + 350);

        this.initParticles();
        this.startTime = Date.now();

        const tvCanvas = document.getElementById('splash-tv-logo');
        if (tvCanvas) this.drawTvLogo(tvCanvas.getContext('2d'), 500, 500);

        const step = () => {
          if (completed) return;
          try {
            const elapsed = Date.now() - this.startTime;
            const timeline = Math.min(1, Math.max(0, elapsed / this.durationMs));
            const progressPercent = Math.floor(timeline * 100);

            const canvas = document.getElementById('splash-canvas');
            const logoBox = document.getElementById('splash-logo-box');
            const wordmark = document.getElementById('splash-wordmark');
            const ringCanvas = document.getElementById('splash-ring-canvas');
            const pctText = document.getElementById('splash-percent-text');

            if (pctText) pctText.textContent = `${progressPercent}%`;

            if (canvas) {
              const ctx = canvas.getContext('2d');
              const w = canvas.width;
              const h = canvas.height;
              ctx.clearRect(0, 0, w, h);
              const cx = w / 2;
              const cy = h / 2 - 150;
              const particlesProgress = Math.min(1, Math.max(0, (timeline - 0.2) / 0.28));

              if (timeline < 0.48) {
                const pAlpha = Math.min(1, Math.max(0, timeline / 0.2));
                for (const p of this.particles) {
                  const pNorm = Math.min(1, Math.max(0, particlesProgress + p.speedDelay));
                  const ease = pNorm * pNorm * pNorm;
                  const curX = p.startX * (1 - ease) + cx;
                  const curY = p.startY * (1 - ease) + cy;
                  ctx.fillStyle = `rgba(229, 9, 20, ${pAlpha * (1 - ease)})`;
                  ctx.beginPath();
                  ctx.arc(curX, curY, p.size, 0, Math.PI * 2);
                  ctx.fill();
                }
              } else {
                const bloomAlpha = timeline < 0.6 ? (1 - (timeline - 0.48) / 0.12) : 0;
                if (bloomAlpha > 0) {
                  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.4);
                  g.addColorStop(0, `rgba(229, 9, 20, ${0.8 * bloomAlpha})`);
                  g.addColorStop(1, 'rgba(229, 9, 20, 0)');
                  ctx.fillStyle = g;
                  ctx.beginPath();
                  ctx.arc(cx, cy, w * 0.4, 0, Math.PI * 2);
                  ctx.fill();
                }
                if (timeline >= 0.72) {
                  const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.3);
                  g2.addColorStop(0, 'rgba(229, 9, 20, 0.22)');
                  g2.addColorStop(1, 'rgba(229, 9, 20, 0)');
                  ctx.fillStyle = g2;
                  ctx.beginPath();
                  ctx.arc(cx, cy, w * 0.3, 0, Math.PI * 2);
                  ctx.fill();
                }
              }
            }

            if (logoBox) {
              const logoP = Math.min(1, Math.max(0, (timeline - 0.25) / 0.25));
              const scale = 0.85 + 0.15 * Math.sin(logoP * Math.PI / 2);
              logoBox.style.opacity = '1';
              logoBox.style.transform = `scale(${scale})`;
            }

            if (wordmark) {
              wordmark.style.opacity = '1';
            }

            if (ringCanvas) {
              const rCtx = ringCanvas.getContext('2d');
              rCtx.clearRect(0, 0, 80, 80);
              const r = 36;
              rCtx.strokeStyle = 'rgba(255,255,255,0.12)';
              rCtx.lineWidth = 3;
              rCtx.beginPath();
              rCtx.arc(40, 40, r, 0, Math.PI * 2);
              rCtx.stroke();

              const startAng = -Math.PI / 2;
              const endAng = startAng + Math.PI * 2 * timeline;
              rCtx.strokeStyle = '#E50914';
              rCtx.lineWidth = 3;
              rCtx.lineCap = 'round';
              rCtx.beginPath();
              rCtx.arc(40, 40, r, startAng, endAng);
              rCtx.stroke();

              if (timeline > 0) {
                const dotX = 40 + r * Math.cos(endAng);
                const dotY = 40 + r * Math.sin(endAng);
                rCtx.fillStyle = '#FF505B';
                rCtx.beginPath();
                rCtx.arc(dotX, dotY, 5, 0, Math.PI * 2);
                rCtx.fill();
              }
            }

            if (timeline < 1) {
              this.animFrame = requestAnimationFrame(step);
            } else {
              completeSplash();
            }
          } catch (err) {
            completeSplash();
          }
        };
        this.animFrame = requestAnimationFrame(step);
      }
    };

      resetAutoFullscreenTimer() {
        if (this.autoFullscreenTimer) clearTimeout(this.autoFullscreenTimer);
        if (AppRouter.currentRoute !== 'list' || this.panelState === 'HIDDEN') return;
        this.autoFullscreenTimer = setTimeout(() => {
          if (AppRouter.currentRoute === 'list' && this.selectedChannel) {
            TvFullscreenManager.request();
            AppRouter.navigate(`player/${this.selectedChannel.id}`);
          }

      scheduleChannelPreview(ch) {
        if (!ch) return;
        if (this.previewTimer) clearTimeout(this.previewTimer);
        this.previewTimer = setTimeout(() => {
          if (AppRouter.currentRoute === 'list' && (!this.selectedChannel || this.selectedChannel.id !== ch.id)) {
            this.selectedChannel = ch;
            IptvViewModel.playChannel(ch.url, 0, ch);
          }
        }, 320);
      },

      getLiveChannels() {
        return IptvViewModel.allChannels.filter(ch => {
          const u = (ch.url || '').toLowerCase().split('?')[0];
          return !(u.endsWith('.mp4') || u.endsWith('.mkv') || u.endsWith('.avi') ||
                   u.endsWith('.m4v') || u.endsWith('.mov') || u.endsWith('.wmv') ||
                   u.endsWith('.flv') || u.endsWith('.webm'));
        });
      },

      getDynamicCategories() {
        const live = this.getLiveChannels();
        const cats = Array.from(new Set(live.map(c => c.category))).filter(c => c && c !== 'All' && c !== 'All Channels' && c !== 'Favorites').sort();
        if (IptvViewModel.favorites.length > 0) {
          return ['Favorites', 'All Channels', ...cats];
        }
        return ['All Channels', ...cats];
      },

      getFilteredChannels() {
        const live = this.getLiveChannels();
        const favIds = new Set(IptvViewModel.favorites.map(f => f.channelId));
        const q = (this.searchQuery || '').trim().toLowerCase();
        return live.filter(ch => {
          const matchesCat = this.activeCategory === 'Favorites'
            ? favIds.has(ch.id)
            : (this.activeCategory === 'All Channels' || ch.category === this.activeCategory);
          const matchesSearch = q ? (ch.name || '').toLowerCase().includes(q) : true;
          return matchesCat && matchesSearch;
        });
      },

              <button id="btn-tvlist-switch-pl" type="button" data-focusable="true" class="tv-focusable" style="height:100%; padding:0 24px; border-radius:9999px; background:linear-gradient(135deg, #202025, #15151A); border:1px solid rgba(255,255,255,0.1); box-shadow:0 8px 20px rgba(0,0,0,0.5); display:flex; align-items:center; gap:11px; color:#FFFFFF; font-size:28px;">
                ${svgIcon('List', 34, '#FFFFFF')}
                <span>Switch Playlist</span>
              </button>
              <div style="width:16px;"></div>
              <div id="tvlist-search-box" style="flex:1; height:100%; border-radius:9999px; background:linear-gradient(135deg, #202025, #15151A); border:1px solid rgba(255,255,255,0.1); box-shadow:0 8px 20px rgba(0,0,0,0.5); padding:0 22px; display:flex; align-items:center; gap:11px;">
                ${svgIcon('Search', 34, '#A0A0A5')}
                <input id="input-tvlist-search" data-focusable="true" type="text" value="${escapeHtml(this.searchQuery)}" placeholder="${escapeHtml(Translator.searchChannels)}" style="width:100%; height:100%; color:#FFFFFF; font-size:28px;" />
              </div>
            </div>

            <div style="height:20px; flex-shrink:0;"></div>

            <!-- Row 2: Content Area (Left Virtualized List + Right Video Panel) -->
            <div style="height:766px; width:100%; display:flex; padding:0 48px; z-index:2; flex-shrink:0;">
              <!-- Left Panel (572px) -->
              <div id="tvlist-left-scroll" style="width:572px; height:100%; border-radius:27px; background:linear-gradient(180deg, rgba(26,26,30,0.92), rgba(16,16,20,0.96)); border:1.5px solid rgba(108,108,117,0.65); box-shadow:0 16px 32px rgba(0,0,0,0.6); overflow-y:auto; position:relative;" class="no-scrollbar">
                <div id="tvlist-virtual-spacer" style="width:100%; position:relative;"></div>
              </div>

              <div style="width:28px; flex-shrink:0;"></div>

              <!-- Right Video Panel -->
              <div id="tvlist-right-video-card" tabindex="0" data-focusable="true" class="tv-focusable" style="flex:1; height:100%; border-radius:27px; background:#000000; border:2px solid #6C6C75; box-shadow:0 24px 48px rgba(108,108,117,0.35); overflow:hidden; position:relative;">
                <div id="tvlist-video-slot" style="width:100%; height:100%;"></div>
              </div>
            </div>

            <div style="height:44px; flex-shrink:0;"></div>

            <!-- Row 4: Footer Legend Pills -->
            <div style="height:64px; width:100%; display:flex; align-items:center; justify-content:center; gap:16px; z-index:2; flex-shrink:0;">
              ${this.renderLegendItem('btn-legend-refresh', 'Refresh', 'Refresh')}
              ${this.renderLegendItem('btn-legend-back', 'ArrowBack', 'Back')}
              ${this.renderLegendItem('btn-legend-menu', 'Menu', 'Menu')}
              ${this.renderLegendItem('btn-legend-search', 'Search', 'Search')}
              ${this.renderLegendItem('btn-legend-fav', 'Favorite', 'Favorite')}
            </div>
          </div>
        `;
      },

      renderVirtualItems(restoreFocus = false) {
        const scrollContainer = document.getElementById('tvlist-left-scroll');
        const spacer = document.getElementById('tvlist-virtual-spacer');
        if (!scrollContainer || !spacer) return;

        const isCategories = this.panelState === 'CATEGORIES';
        const items = isCategories ? this.getDynamicCategories() : this.getFilteredChannels();
        if (this.focusedIndex >= items.length) this.focusedIndex = Math.max(0, items.length - 1);
        const totalHeight = items.length * this.rowHeight;
        spacer.style.height = `${Math.max(totalHeight, this.viewportHeight)}px`;

        const scrollTop = scrollContainer.scrollTop;
        const startIdx = Math.max(0, Math.floor(scrollTop / this.rowHeight) - 4);
        const endIdx = Math.min(items.length - 1, Math.ceil((scrollTop + this.viewportHeight) / this.rowHeight) + 4);

        let html = '';
        for (let idx = startIdx; idx <= endIdx; idx++) {
          const topPx = idx * this.rowHeight;
          if (isCategories) {
            const cat = items[idx];
            const isSelected = cat === this.activeCategory || idx === this.focusedIndex;
            const iconName = getCategoryIconName(cat);
            html += `
              <div data-focusable="true" data-virtual-idx="${idx}" tabindex="0" style="position:absolute; top:${topPx}px; left:0; width:100%; height:${this.rowHeight}px; padding:5px 13px; display:flex; flex-direction:column; justify-content:center;">
                <div class="tv-category-item ${isSelected ? 'is-selected' : ''} ${idx === this.focusedIndex ? 'is-focused' : ''}" style="width:100%; height:75px; padding:0 16px; display:flex; align-items:center; border-radius:9999px;">
                  <div style="width:45px; height:45px; border-radius:50%; background:${isSelected ? 'rgba(255,255,255,0.25)' : 'linear-gradient(135deg,#2A2A30,#1A1A20)'}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                    ${svgIcon(iconName, 24, isSelected ? '#FFFFFF' : '#A0A0A5')}
                  </div>
                  <div style="width:16px;"></div>
                  <div style="color:#FFFFFF; font-size:26px; font-weight:${isSelected ? '800' : '600'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;">
                    ${escapeHtml(cat)}
                  </div>
                </div>
                ${!isSelected ? `<div style="height:1px; background:rgba(255,255,255,0.05); margin:0 22px;"></div>` : ''}
              </div>
            `;
          } else {
            const ch = items[idx];
            const isSelected = idx === this.focusedIndex || (this.selectedChannel && this.selectedChannel.id === ch.id);
            const chNum = ch.number ? `${ch.number}.` : `${idx + 1}.`;
            const initial = (ch.name || 'C').charAt(0).toUpperCase();
            html += `
              <div data-focusable="true" data-virtual-idx="${idx}" tabindex="0" style="position:absolute; top:${topPx}px; left:0; width:100%; height:${this.rowHeight}px; padding:5px 13px; display:flex; flex-direction:column; justify-content:center;">
                <div class="tv-channel-item ${isSelected ? 'is-selected' : ''} ${idx === this.focusedIndex ? 'is-focused' : ''}" style="width:100%; height:75px; padding:0 16px; display:flex; align-items:center; border-radius:9999px;">
                  <span style="color:${isSelected ? '#FFFFFF' : '#A0A0A5'}; font-size:26px; font-weight:700; flex-shrink:0;">${escapeHtml(chNum)}</span>
                  <div style="width:11px;"></div>
                  ${ch.streamThumbnail ? `
                    <img src="${escapeHtml(ch.streamThumbnail)}" alt="" loading="lazy" onerror="this.style.display='none'" style="width:45px; height:45px; border-radius:50%; background:#FFFFFF; padding:3px; object-fit:cover; flex-shrink:0;" />
                  ` : `
                    <div style="width:45px; height:45px; border-radius:50%; background:${isSelected ? 'rgba(255,255,255,0.25)' : 'linear-gradient(135deg,#2A2A30,#1A1A20)'}; display:flex; align-items:center; justify-content:center; color:#FFFFFF; font-size:24px; font-weight:800; flex-shrink:0;">
                      ${escapeHtml(initial)}
                    </div>
                  `}
                  <div style="width:16px;"></div>
                  <div style="color:#FFFFFF; font-size:26px; font-weight:${isSelected ? '800' : '600'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;">
                    ${escapeHtml(ch.name)}
                  </div>
                </div>
                ${!isSelected ? `<div style="height:1px; background:rgba(255,255,255,0.05); margin:0 22px;"></div>` : ''}
              </div>
            `;
          }
        }

        spacer.innerHTML = html;

        spacer.querySelectorAll('[data-virtual-idx]').forEach(el => {
          const i = Number(el.getAttribute('data-virtual-idx'));
          el.addEventListener('focus', () => {
            this.focusedIndex = i;
            this.resetAutoFullscreenTimer();
            if (!isCategories && items[i]) {
              this.focusedChannel = items[i];
              this.scheduleChannelPreview(items[i]);
            }
          });
          el.addEventListener('click', () => {
            TvFullscreenManager.request();
            this.resetAutoFullscreenTimer();
            this.focusedIndex = i;
            if (isCategories) {
              this.activeCategory = items[i];
              this.panelState = 'CHANNELS';
              this.focusedIndex = 0;
              scrollContainer.scrollTop = 0;
              this.renderVirtualItems(true);
            } else {
              const ch = items[i];
              if (!ch) return;
              this.focusedChannel = ch;
              this.selectedChannel = ch;
              IptvViewModel.saveCurrentPosition(ch, 0);
              IptvViewModel.playChannel(ch.url, 0, ch);
              // Immediately open Fullscreen Player on OK/Click so TV users get instant full screen
              AppRouter.navigate(`player/${ch.id}`);
            }
          });
        });

        if (restoreFocus) {
          const targetEl = scrollContainer.querySelector(`[data-virtual-idx="${this.focusedIndex}"]`);
          if (targetEl) {
            TvSpatialNav.setFocus(targetEl, { preventNativeFocusOnInput: true });
          }
        }
      },

      stepListBy(delta) {
        const scrollContainer = document.getElementById('tvlist-left-scroll');
        if (!scrollContainer) return;
        const isCategories = this.panelState === 'CATEGORIES';
        const items = isCategories ? this.getDynamicCategories() : this.getFilteredChannels();
        if (!items.length) return;
        this.focusedIndex = Math.max(0, Math.min(items.length - 1, this.focusedIndex + delta));
        const itemTop = this.focusedIndex * this.rowHeight;
        const itemBottom = (this.focusedIndex + 1) * this.rowHeight;
        if (itemBottom > scrollContainer.scrollTop + this.viewportHeight) {
          scrollContainer.scrollTop = itemBottom - this.viewportHeight;
        } else if (itemTop < scrollContainer.scrollTop) {
          scrollContainer.scrollTop = itemTop;
        }
        this.renderVirtualItems(true);
      },

      handleDirectionalKey(dir) {
        this.resetAutoFullscreenTimer();
        const scrollContainer = document.getElementById('tvlist-left-scroll');
        if (!scrollContainer) return false;
        const cur = TvSpatialNav.currentFocusedEl || document.activeElement;
        const isInsideLeftList = cur && (scrollContainer.contains(cur) || cur.hasAttribute('data-virtual-idx'));

        // Fast jump into left list when pressing Down from top bar or Left from video preview
        if (!isInsideLeftList) {
          if (dir === 'left' && cur && cur.id === 'tvlist-right-video-card') {
            this.renderVirtualItems(true);
            return true;
          }
          if (dir === 'down' && cur && (cur.id === 'btn-tvlist-switch-pl' || cur.id === 'input-tvlist-search')) {
            this.renderVirtualItems(true);
            return true;
          }
          return false;
        }

        if (dir === 'right') {
          const rightCard = document.getElementById('tvlist-right-video-card');
          if (rightCard) {
            TvSpatialNav.setFocus(rightCard);
            return true;
          }
          return false;
        }

        const isCategories = this.panelState === 'CATEGORIES';
        const items = isCategories ? this.getDynamicCategories() : this.getFilteredChannels();
        if (!items.length) return false;

        if (dir === 'down') {
          if (this.focusedIndex < items.length - 1) {
            this.focusedIndex++;
            const itemBottom = (this.focusedIndex + 1) * this.rowHeight;
            if (itemBottom > scrollContainer.scrollTop + this.viewportHeight) {
              scrollContainer.scrollTop = itemBottom - this.viewportHeight;
            }
            this.renderVirtualItems(true);
            return true;
          }
          return false;
        }
        if (dir === 'up') {
          if (this.focusedIndex > 0) {
            this.focusedIndex--;
            const itemTop = this.focusedIndex * this.rowHeight;
            if (itemTop < scrollContainer.scrollTop) {
              scrollContainer.scrollTop = itemTop;
            }
            this.renderVirtualItems(true);
            return true;
          }
          return false;
        }
        return false;
      },

      bindEvents() {
        IptvViewModel.attachVideoToSlot('tvlist-video-slot');
        if (!IptvViewModel.currentChannel) {
          const firstCh = this.getFilteredChannels()[0];
          if (firstCh) {
            this.selectedChannel = firstCh;
            this.focusedChannel = firstCh;
            IptvViewModel.playChannel(firstCh.url, 0, firstCh);
          }
        } else {
          this.selectedChannel = IptvViewModel.currentChannel;
          this.focusedChannel = IptvViewModel.currentChannel;
        }

        if (this.panelState === 'HIDDEN') {
          const fs = document.getElementById('tvlist-hidden-fullscreen');
          if (fs) {
            fs.addEventListener('click', () => {
              this.panelState = 'CHANNELS';
              AppRouter.render();
            });
          }
          return;
        }

        this.resetAutoFullscreenTimer();
        const scrollContainer = document.getElementById('tvlist-left-scroll');
        if (scrollContainer) {
          scrollContainer.addEventListener('scroll', () => {
            this.renderVirtualItems(false);
          }, { passive: true });
          this.renderVirtualItems(true);
          setTimeout(() => {
            const firstItem = scrollContainer.querySelector(`[data-virtual-idx="${this.focusedIndex}"]`) || scrollContainer.querySelector('[data-virtual-idx="0"]');
            if (firstItem) TvSpatialNav.setFocus(firstItem, { preventNativeFocusOnInput: true });
          }, 25);
        }

        const switchPlBtn = document.getElementById('btn-tvlist-switch-pl');
        if (switchPlBtn) {
          switchPlBtn.addEventListener('click', () => {
            showToast("Playlists are now merged automatically. Use 'Manage' to toggle.");
          });
          switchPlBtn.addEventListener('focus', () => { switchPlBtn.style.borderColor = '#E5141F'; });
          switchPlBtn.addEventListener('blur', () => { switchPlBtn.style.borderColor = 'rgba(255,255,255,0.1)'; });
        }

        const searchInput = document.getElementById('input-tvlist-search');
        if (searchInput) {
          searchInput.addEventListener('focus', () => {
            if (this.panelState === 'CATEGORIES') {
              this.panelState = 'CHANNELS';
              this.focusedIndex = 0;
              this.renderVirtualItems();
            }
          });
          searchInput.addEventListener('input', (e) => {
            this.searchQuery = e.target.value;
            this.focusedIndex = 0;
            this.renderVirtualItems();
          });
        }

        const rightVideo = document.getElementById('tvlist-right-video-card');
        if (rightVideo) {
          rightVideo.addEventListener('click', () => {
            if (this.selectedChannel) {
              AppRouter.navigate(`player/${this.selectedChannel.id}`);
            } else {
              this.panelState = 'HIDDEN';
              AppRouter.render();
            }
          });
          rightVideo.addEventListener('focus', () => { rightVideo.style.borderColor = '#E5141F'; });
          rightVideo.addEventListener('blur', () => { rightVideo.style.borderColor = '#6C6C75'; });
        }

        document.querySelectorAll('.tv-legend-btn').forEach(btn => {
          btn.addEventListener('focus', () => {
            btn.style.background = '#E5141F';
            btn.style.boxShadow = '0 6px 20px rgba(229,20,31,0.6)';
            btn.style.fontWeight = '700';
          });
          btn.addEventListener('blur', () => {
            btn.style.background = 'transparent';
            btn.style.boxShadow = 'none';
            btn.style.fontWeight = '500';
          });
        });

        const btnRefresh = document.getElementById('btn-legend-refresh');
        if (btnRefresh) btnRefresh.addEventListener('click', () => IptvViewModel.refreshPlaylists());
        const btnBack = document.getElementById('btn-legend-back');
        if (btnBack) btnBack.addEventListener('click', () => AppRouter.handleBack());
        const btnMenu = document.getElementById('btn-legend-menu');
        if (btnMenu) btnMenu.addEventListener('click', () => AppRouter.navigate('input'));
        const btnSearch = document.getElementById('btn-legend-search');
        if (btnSearch) btnSearch.addEventListener('click', () => { if (searchInput) searchInput.focus(); });
        const btnFav = document.getElementById('btn-legend-fav');
        if (btnFav) {
          btnFav.addEventListener('click', async () => {
            const target = this.focusedChannel || this.selectedChannel;
            if (target) {
              await IptvViewModel.toggleFavorite(target.id, 'Channel');
              this.renderVirtualItems();
            }
          });
        }
      }
    };

    // =========================================================================
    // 18. PLAYER OVERLAY & VOD PLAYER OVERLAY CONTROLLER
    // =========================================================================
    const PlayerOverlayController = {
      currentIndex: 0,
      isOverlayVisible: true,
      typedChannelNumber: '',
      countdownSeconds: 2,
      countdownTimer: null,
      autoHideTimer: null,
      vodTickTimer: null,
      isChannelSwitching: false,
      focusedControl: 0, // 0: None, 1: Audio, 2: Aspect, 3: Quality, 4: Info
      isLocked: false,
      showCastDialog: false,
      showSubtitlesDialog: false,
      showEpisodesDialog: false,
      castMembers: [],
      castIsLoading: false,
      selectedSubtitleIdx: -1,

      initForChannelId(channelId) {
        AppNavigationState.isChannelJumpActive = true;
        const idx = IptvViewModel.allChannels.findIndex(c => c.id === channelId);
        this.currentIndex = idx >= 0 ? idx : 0;
        this.isOverlayVisible = true;
        this.typedChannelNumber = '';
        this.focusedControl = 0;
        this.isLocked = false;
        this.showCastDialog = false;
        this.showSubtitlesDialog = false;
        this.showEpisodesDialog = false;
        const ch = this.getDisplayedChannel();
        if (ch && (!IptvViewModel.currentChannel || IptvViewModel.currentChannel.id !== ch.id)) {
          IptvViewModel.playChannel(ch.url, 0, ch);
        }
        this.triggerChannelSwitchSpinner();
        this.resetAutoHide();
      },

      cleanup() {
        AppNavigationState.isChannelJumpActive = false;
        if (this.countdownTimer) clearInterval(this.countdownTimer);
        if (this.autoHideTimer) clearTimeout(this.autoHideTimer);
        if (this.vodTickTimer) clearInterval(this.vodTickTimer);
      },

      getDisplayedChannel() {
        return IptvViewModel.allChannels[this.currentIndex] || IptvViewModel.currentChannel || null;
      },

      isVodStream(ch) {
        if (!ch) return false;
        const u = (ch.url || '').toLowerCase().split('?')[0];
        if (u.endsWith('.mp4') || u.endsWith('.mkv') || u.endsWith('.avi') ||
            u.endsWith('.m4v') || u.endsWith('.mov') || u.endsWith('.wmv') ||
            u.endsWith('.flv') || u.endsWith('.webm')) {
          return true;
        }
        const cat = (ch.category || '').toLowerCase();
        return cat.includes('movie') || cat.includes('series') || cat.includes('vod') || cat.includes('local video');
      },

      triggerChannelSwitchSpinner() {
        this.isChannelSwitching = true;
        setTimeout(() => {
          this.isChannelSwitching = false;
          this.updateOverlayDom();
        }, 700);
      },

      resetAutoHide() {
        if (this.autoHideTimer) clearTimeout(this.autoHideTimer);
        if (this.isOverlayVisible && !this.showCastDialog && !this.showSubtitlesDialog && !this.showEpisodesDialog) {
          this.autoHideTimer = setTimeout(() => {
            this.isOverlayVisible = false;
            this.updateOverlayDom();
          }, 6000);
        }
      },

      switchChannelByOffset(delta) {
        const channels = IptvViewModel.allChannels;
        if (!channels.length) return;
        let nextIdx = (this.currentIndex + delta) % channels.length;
        if (nextIdx < 0) nextIdx = channels.length - 1;
        this.currentIndex = nextIdx;
        const nextCh = channels[nextIdx];
        this.isOverlayVisible = true;
        this.focusedControl = 0;
        IptvViewModel.playChannel(nextCh.url, 0, nextCh);
        this.triggerChannelSwitchSpinner();
        this.resetAutoHide();
        this.updateOverlayDom();
      },

      playNextEpisode() {
        const cur = this.getDisplayedChannel();
        if (!cur) return;
        const channels = IptvViewModel.allChannels;
        const nextEp = channels.slice(this.currentIndex + 1).find(c => c.category === cur.category);
        if (nextEp) {
          const nextIdx = channels.indexOf(nextEp);
          if (nextIdx >= 0) {
            this.currentIndex = nextIdx;
            IptvViewModel.playChannel(nextEp.url, 0, nextEp);
            this.updateOverlayDom();
          }
        } else {
          showToast('No next episode in this category');
        }
      },

      onPlaybackEnded() {
        const ch = this.getDisplayedChannel();
        if (this.isVodStream(ch)) {
          this.playNextEpisode();
        }
      },

      appendChannelDigit(digit) {
        this.typedChannelNumber = (this.typedChannelNumber + String(digit)).slice(0, 4);
        this.countdownSeconds = 2;
        if (this.countdownTimer) clearInterval(this.countdownTimer);
        this.updateOverlayDom();

        this.countdownTimer = setInterval(() => {
          this.countdownSeconds--;
          if (this.countdownSeconds <= 0) {
            clearInterval(this.countdownTimer);
            this.countdownTimer = null;
            const channels = IptvViewModel.allChannels;
            const curCat = (this.getDisplayedChannel() && this.getDisplayedChannel().category) || '';
            const matches = channels.filter(c => String(c.number) === this.typedChannelNumber);
            const target = matches.find(c => c.category === curCat) || matches.find(c => !this.isVodStream(c)) || matches[0];
            if (target) {
              const idx = channels.indexOf(target);
              if (idx >= 0) {
                this.currentIndex = idx;
                IptvViewModel.playChannel(target.url, 0, target);
                this.triggerChannelSwitchSpinner();
              }
            } else {
              showToast(`Channel ${this.typedChannelNumber} not found`);
            }
            this.typedChannelNumber = '';
            this.updateOverlayDom();
          } else {
            this.updateOverlayDom();
          }
        }, 1000);
      },

      handleKeyDown(e) {
        const ch = this.getDisplayedChannel();
        const isVod = this.isVodStream(ch);

        // Locked screen check
        if (this.isLocked) {
          if (e.key === 'Enter' || e.keyCode === 13) {
            this.isLocked = false;
            this.isOverlayVisible = true;
            this.resetAutoHide();
            this.updateOverlayDom();
          }
          return true;
        }

        // Channel Up / Channel Down (Tizen 427/428 or PageUp/PageDown)
        if (e.keyCode === 427 || e.key === 'PageUp' || e.key === 'ChannelUp') {
          this.switchChannelByOffset(-1);
          return true;
        }
        if (e.keyCode === 428 || e.key === 'PageDown' || e.key === 'ChannelDown') {
          this.switchChannelByOffset(1);
          return true;
        }

        // Number keys 0-9 for Channel Jump
        if (!isVod && ((e.keyCode >= 48 && e.keyCode <= 57) || (e.keyCode >= 96 && e.keyCode <= 105))) {
          const digit = e.keyCode >= 96 ? (e.keyCode - 96) : (e.keyCode - 48);
          this.appendChannelDigit(digit);
          return true;
        }

        // Media Play/Pause hardware keys on Samsung TV remote
        const videoEl = document.getElementById('global-video-player');
        if (e.keyCode === 415 || e.key === 'MediaPlay') {
          if (videoEl) videoEl.play().catch(() => {});
          return true;
        }
        if (e.keyCode === 19 || e.key === 'MediaPause') {
          if (videoEl) videoEl.pause();
          return true;
        }
        if (e.keyCode === 10252 || e.key === 'MediaPlayPause') {
          if (videoEl) {
            if (videoEl.paused) videoEl.play().catch(() => {});
            else videoEl.pause();
          }
          return true;
        }

        if (isVod) {
          if (!this.isOverlayVisible && ['Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            this.isOverlayVisible = true;
            this.resetAutoHide();
            this.updateOverlayDom();
            return true;
          }
          return false; // Let spatial D-pad navigate VOD buttons
        }

        // Live Stream D-Pad Controls (Exact Port of PlayerOverlayScreen.kt)
        if (e.key === 'Backspace' && this.typedChannelNumber) {
          this.typedChannelNumber = this.typedChannelNumber.slice(0, -1);
          this.updateOverlayDom();
          return true;
        }
        if (e.key === 'ContextMenu' || e.keyCode === 18 || e.keyCode === 457) {
          this.isOverlayVisible = !this.isOverlayVisible;
          if (this.isOverlayVisible) this.focusedControl = 1;
          this.resetAutoHide();
          this.updateOverlayDom();
          return true;
        }
        if (e.key === 'Enter' || e.keyCode === 13) {
          if (!this.isOverlayVisible) {
            this.isOverlayVisible = true;
            this.focusedControl = 0;
            this.resetAutoHide();
          } else {
            if (this.focusedControl === 1) IptvViewModel.cycleAudioTrack();
            else if (this.focusedControl === 2) IptvViewModel.applyVideoAspectRatio((IptvViewModel.currentResizeModeIdx + 1) % 3);
            else if (this.focusedControl === 3) IptvViewModel.cycleVideoQuality();
            else if (this.focusedControl === 4) showToast(`${ch ? ch.name : 'Stream'} • ${ch ? ch.category : 'Live TV'}`);
            else this.isOverlayVisible = false;
            this.resetAutoHide();
          }
          this.updateOverlayDom();
          return true;
        }
        if (e.key === 'ArrowRight' || e.keyCode === 39) {
          if (!this.isOverlayVisible) {
            this.isOverlayVisible = true;
            this.focusedControl = 1;
          } else {
            if (this.focusedControl >= 1 && this.focusedControl <= 3) this.focusedControl++;
            else if (this.focusedControl === 0) this.focusedControl = 1;
          }
          this.resetAutoHide();
          this.updateOverlayDom();
          return true;
        }
        if (e.key === 'ArrowLeft' || e.keyCode === 37) {
          if (!this.isOverlayVisible) {
            this.isOverlayVisible = true;
            this.focusedControl = 1;
          } else {
            if (this.focusedControl >= 2 && this.focusedControl <= 4) this.focusedControl--;
            else if (this.focusedControl === 0) this.focusedControl = 1;
          }
          this.resetAutoHide();
          this.updateOverlayDom();
          return true;
        }
        if (e.key === 'ArrowUp' || e.keyCode === 38) {
          if (!this.isOverlayVisible || this.focusedControl === 0) {
            this.switchChannelByOffset(-1);
          } else {
            this.focusedControl = 0;
            this.updateOverlayDom();
          }
          return true;
        }
        if (e.key === 'ArrowDown' || e.keyCode === 40) {
          if (!this.isOverlayVisible || this.focusedControl === 0) {
            this.switchChannelByOffset(1);
          } else {
            this.focusedControl = 0;
            this.updateOverlayDom();
          }
          return true;
        }
        return false;
      },

      formatMs(ms) {
        const totalSecs = Math.max(0, Math.floor((ms || 0) / 1000));
        const hrs = Math.floor(totalSecs / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;
        if (hrs > 0) return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      },

                ${svgIcon('Cast', 24, '#FFFFFF')}
              </button>
            </div>

            <!-- CENTER CONTROLS -->
            <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:40px;">
              <button id="btn-vod-rw10" type="button" data-focusable="true" class="tv-focusable vod-circle-btn" style="width:100px; height:100px; border-radius:50%; background:transparent; border:1px solid rgba(255,255,255,0.6); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#FFFFFF;">
                ${svgIcon('FastRewind', 40, '#FFFFFF')}
                <span style="font-size:18px; font-weight:500; margin-top:4px;">10</span>
              </button>
              <button id="btn-vod-playpause-center" type="button" data-focusable="true" data-autofocus="true" class="tv-focusable vod-circle-btn" style="width:140px; height:140px; border-radius:50%; background:transparent; border:2px solid rgba(255,255,255,0.6); display:flex; align-items:center; justify-content:center; color:#FFFFFF;">
                ${svgIcon(isPlaying ? 'Pause' : 'PlayArrow', 64, '#FFFFFF')}
              </button>
              <button id="btn-vod-ff10" type="button" data-focusable="true" class="tv-focusable vod-circle-btn" style="width:100px; height:100px; border-radius:50%; background:transparent; border:1px solid rgba(255,255,255,0.6); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#FFFFFF;">
                ${svgIcon('FastForward', 40, '#FFFFFF')}
                <span style="font-size:18px; font-weight:500; margin-top:4px;">10</span>
              </button>
            </div>

            <!-- BOTTOM CONTROLS -->
            <div style="position:absolute; bottom:0; left:0; right:0; padding:40px 48px; display:flex; flex-direction:column;">
              <div style="width:100%; display:flex; align-items:center; gap:16px;">
                <span id="vod-pos-text" style="color:#FFFFFF; font-size:18px; font-weight:700;">${this.formatMs(curMs)}</span>
                <input id="vod-seek-slider" data-focusable="true" type="range" min="0" max="1000" value="${sliderVal}" class="vod-slider" style="flex:1;" />
                <span id="vod-dur-text" style="color:#FFFFFF; font-size:18px; font-weight:700;">${this.formatMs(durMs)}</span>
              </div>
              <div style="height:48px;"></div>
              <div style="width:100%; display:flex; align-items:center; justify-content:space-between;">
                ${this.renderVodActionIcon('btn-vod-lock', 'Lock', 'Lock')}
                ${this.renderVodActionIcon('btn-vod-episodes', 'List', 'Episodes')}
                ${this.renderVodActionIcon('btn-vod-subtitles', 'Subtitles', 'Subtitles')}
                ${this.renderVodActionIcon('btn-vod-audio', 'Audiotrack', 'Audio Track')}
                ${this.renderVodActionIcon('btn-vod-playpause-bottom', isPlaying ? 'Pause' : 'PlayArrow', '', true)}
                ${this.renderVodActionIcon('btn-vod-next', 'SkipNext', 'Next Ep.')}
                ${this.renderVodActionIcon('btn-vod-quality', 'Settings', 'Quality')}
                ${this.renderVodActionIcon('btn-vod-aspect', 'AspectRatio', 'Aspect Ratio')}
              </div>
            </div>
          </div>
          ${modalsHtml}
        `;
      },

      render() {
        return `
          <div id="player-screen-root" style="width:100%; height:100%; background:#000000; position:relative; overflow:hidden;">
            <div id="player-video-slot" style="position:absolute; inset:0; width:100%; height:100%;"></div>
            <div id="player-dynamic-overlay" style="position:absolute; inset:0; width:100%; height:100%;"></div>
          </div>
        `;
      },

      updateOverlayDom() {
        const container = document.getElementById('player-dynamic-overlay');
        if (!container) return;
        const ch = this.getDisplayedChannel();
        const isVod = this.isVodStream(ch);

        let errorHtml = '';
        if (IptvViewModel.playerError) {
          errorHtml = this.renderSmpteColorBars();
        } else if (this.isChannelSwitching && !isVod) {
          errorHtml = `
            <div style="position:absolute; inset:0; background:#000000; display:flex; align-items:center; justify-content:center; z-index:10;">
              <div style="width:56px; height:56px; border:4px solid rgba(255,0,51,0.25); border-top-color:#FF0033; border-radius:50%;" class="spin-slow"></div>
            </div>
          `;
        }

        container.innerHTML = errorHtml + (isVod ? this.renderVodOverlay(ch) : this.renderLiveOsd(ch));
        this.bindOverlayEvents();
      },

      bindOverlayEvents() {
        const ch = this.getDisplayedChannel();
        const videoEl = document.getElementById('global-video-player');

        // Live OSD buttons
        document.querySelectorAll('[data-osd-ctrl]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = Number(btn.getAttribute('data-osd-ctrl'));
            this.focusedControl = idx;
            if (idx === 1) IptvViewModel.cycleAudioTrack();
            else if (idx === 2) IptvViewModel.applyVideoAspectRatio((IptvViewModel.currentResizeModeIdx + 1) % 3);
            else if (idx === 3) IptvViewModel.cycleVideoQuality();
            else if (idx === 4) showToast(`${ch ? ch.name : 'Stream'} • ${ch ? ch.category : 'Live TV'}`);
            this.resetAutoHide();
            this.updateOverlayDom();
          });
        });

        // VOD Controls
        const unlockBtn = document.getElementById('btn-vod-unlock');
        if (unlockBtn) {
          unlockBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.isLocked = false;
            this.isOverlayVisible = true;
            this.resetAutoHide();
            this.updateOverlayDom();
          });
        }

        const backBtn = document.getElementById('btn-vod-back');
        if (backBtn) backBtn.addEventListener('click', (e) => { e.stopPropagation(); AppRouter.handleBack(); });

        const castBtn = document.getElementById('btn-vod-cast');
        if (castBtn) {
          castBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            this.showCastDialog = true;
            this.updateOverlayDom();
            if (this.castMembers.length === 0 && !this.castIsLoading) {
              this.castIsLoading = true;
              this.updateOverlayDom();
              const members = await TmdbService.getCastForTitle(ch ? ch.name : '');
              this.castMembers = members || [];
              this.castIsLoading = false;
              this.updateOverlayDom();
            }
          });
        }

        const closeCast = document.getElementById('btn-close-cast-modal');
        if (closeCast) closeCast.addEventListener('click', (e) => { e.stopPropagation(); this.showCastDialog = false; this.updateOverlayDom(); });
        const closeSubs = document.getElementById('btn-close-subs-modal');
        if (closeSubs) closeSubs.addEventListener('click', (e) => { e.stopPropagation(); this.showSubtitlesDialog = false; this.updateOverlayDom(); });
        const subOff = document.getElementById('btn-sub-off');
        if (subOff) subOff.addEventListener('click', (e) => { e.stopPropagation(); showToast('Subtitles: Off'); this.showSubtitlesDialog = false; this.updateOverlayDom(); });
        const closeEps = document.getElementById('btn-close-eps-modal');
        if (closeEps) closeEps.addEventListener('click', (e) => { e.stopPropagation(); this.showEpisodesDialog = false; this.updateOverlayDom(); });

        document.querySelectorAll('[data-ep-select]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-ep-select');
            const idx = IptvViewModel.allChannels.findIndex(c => c.id === id);
            if (idx >= 0) {
              this.currentIndex = idx;
              const target = IptvViewModel.allChannels[idx];
              IptvViewModel.playChannel(target.url, 0, target);
              this.showEpisodesDialog = false;
              this.updateOverlayDom();
            }
          });
        });

        const rwBtn = document.getElementById('btn-vod-rw10');
        if (rwBtn) {
          rwBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (videoEl) videoEl.currentTime = Math.max(0, (videoEl.currentTime || 0) - 10);
            this.resetAutoHide();
            this.updateOverlayDom();
          });
        }

        const ffBtn = document.getElementById('btn-vod-ff10');
        if (ffBtn) {
          ffBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (videoEl) videoEl.currentTime = Math.min(videoEl.duration || 3600, (videoEl.currentTime || 0) + 10);
            this.resetAutoHide();
            this.updateOverlayDom();
          });
        }

        const togglePlay = (e) => {
          e.stopPropagation();
          if (videoEl) {
            if (videoEl.paused) videoEl.play().catch(() => {});
            else videoEl.pause();
          }
          this.resetAutoHide();
          setTimeout(() => this.updateOverlayDom(), 50);
        };
        const ppCenter = document.getElementById('btn-vod-playpause-center');
        if (ppCenter) ppCenter.addEventListener('click', togglePlay);
        const ppBottom = document.getElementById('btn-vod-playpause-bottom');
        if (ppBottom) ppBottom.addEventListener('click', togglePlay);

        const slider = document.getElementById('vod-seek-slider');
        if (slider) {
          slider.addEventListener('click', (e) => e.stopPropagation());
          slider.addEventListener('input', (e) => {
            if (videoEl && videoEl.duration && isFinite(videoEl.duration)) {
              videoEl.currentTime = (Number(e.target.value) / 1000) * videoEl.duration;
            }
            this.resetAutoHide();
          });
        }

        const lockBtn = document.getElementById('btn-vod-lock');
        if (lockBtn) lockBtn.addEventListener('click', (e) => { e.stopPropagation(); this.isLocked = true; this.isOverlayVisible = false; this.updateOverlayDom(); });
        const epsBtn = document.getElementById('btn-vod-episodes');
        if (epsBtn) epsBtn.addEventListener('click', (e) => { e.stopPropagation(); this.showEpisodesDialog = true; this.updateOverlayDom(); });
        const subsBtn = document.getElementById('btn-vod-subtitles');
        if (subsBtn) subsBtn.addEventListener('click', (e) => { e.stopPropagation(); this.showSubtitlesDialog = true; this.updateOverlayDom(); });
        const audBtn = document.getElementById('btn-vod-audio');
        if (audBtn) audBtn.addEventListener('click', (e) => { e.stopPropagation(); IptvViewModel.cycleAudioTrack(); this.resetAutoHide(); });
        const nextBtn = document.getElementById('btn-vod-next');
        if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); this.playNextEpisode(); this.resetAutoHide(); });
        const qualBtn = document.getElementById('btn-vod-quality');
        if (qualBtn) qualBtn.addEventListener('click', (e) => { e.stopPropagation(); IptvViewModel.cycleVideoQuality(); this.resetAutoHide(); });
        const aspBtn = document.getElementById('btn-vod-aspect');
        if (aspBtn) aspBtn.addEventListener('click', (e) => { e.stopPropagation(); IptvViewModel.applyVideoAspectRatio((IptvViewModel.currentResizeModeIdx + 1) % 3); this.resetAutoHide(); });

        document.querySelectorAll('.vod-circle-btn, .vod-action-btn').forEach(btn => {
          btn.addEventListener('focus', () => {
            btn.style.borderColor = '#FF0033';
            btn.style.background = 'rgba(255,0,51,0.15)';
            this.resetAutoHide();
          });
          btn.addEventListener('blur', () => {
            btn.style.borderColor = 'rgba(255,255,255,0.4)';
            btn.style.background = btn.classList.contains('vod-action-btn') ? 'rgba(9,10,14,0.4)' : 'transparent';
          });
        });
      },

      bindEvents() {
        IptvViewModel.attachVideoToSlot('player-video-slot');
        this.updateOverlayDom();

        const root = document.getElementById('player-screen-root');
        if (root) {
          root.addEventListener('click', () => {
            if (this.isLocked || this.showCastDialog || this.showSubtitlesDialog || this.showEpisodesDialog) return;
            this.isOverlayVisible = !this.isOverlayVisible;
            if (this.isOverlayVisible) this.focusedControl = 1;
            this.resetAutoHide();
            this.updateOverlayDom();
          });
        }

        if (this.vodTickTimer) clearInterval(this.vodTickTimer);
        this.vodTickTimer = setInterval(() => {
          const videoEl = document.getElementById('global-video-player');
          const posText = document.getElementById('vod-pos-text');
          const durText = document.getElementById('vod-dur-text');
          const slider = document.getElementById('vod-seek-slider');
          if (videoEl && posText && durText && slider && document.activeElement !== slider) {
            const curMs = (videoEl.currentTime || 0) * 1000;
            const durMs = (videoEl.duration && isFinite(videoEl.duration)) ? (videoEl.duration * 1000) : 1;
            posText.textContent = this.formatMs(curMs);
            durText.textContent = this.formatMs(durMs);
            slider.value = durMs > 1 ? Math.min(1000, Math.round((curMs / durMs) * 1000)) : 0;
            if (this.getDisplayedChannel()) {
              IptvViewModel.saveCurrentPosition(this.getDisplayedChannel(), Math.floor(curMs));
            }
          }
        }, 1000);
      }
    };

    // =========================================================================
    // 19. MOVIE SCREEN & SERIES DETAILS SCREEN CONTROLLERS (Zero Emojis — SVG Star)
    // =========================================================================
    const MovieScreenController = {
      searchQuery: '',
      selectedCategory: 'Featured',

      getVodList() {
        if (IptvViewModel.vodItems && IptvViewModel.vodItems.length > 0) {
          return IptvViewModel.vodItems;
        }
        // Fallback if playlist only had live streams: parse SAMPLE_M3U_CONTENT VODs
        const sampleChannels = PlaylistParser.parseM3u(SAMPLE_M3U_CONTENT).filter(c => c.url.endsWith('.mp4'));
        return VodParser.parseVodChannels(sampleChannels);
      },

      getCategories(movies) {
        const cats = Array.from(new Set(movies.map(m => m.category).filter(Boolean))).sort();
        return ['Featured', ...cats];
      },

      getFilteredMovies(movies) {
        const q = (this.searchQuery || '').trim().toLowerCase();
        if (!q) {
          return this.selectedCategory === 'Featured' ? movies : movies.filter(m => m.category === this.selectedCategory);
        }
        return movies.filter(m => (m.title || '').toLowerCase().includes(q));
      },

      renderMetaTag(contentHtml) {
        return `<div style="background:rgba(255,255,255,0.1); border-radius:6px; padding:6px 12px; color:#A0A0A0; font-size:14px; display:inline-flex; align-items:center; gap:5px;">${contentHtml}</div>`;
      },

      render() {
        const movies = this.getVodList();
        const categories = this.getCategories(movies);
        const filtered = this.getFilteredMovies(movies);
        const featured = filtered[0] || null;
        const continueWatching = filtered.slice(0, 4);
        const popularMovies = filtered;

        const heroTmdb = featured ? featured.tmdbDetails : null;
        const heroFallback = featured ? (featured.kind === 'Movie' ? featured.channel.streamThumbnail : null) : null;
        const heroImg = (heroTmdb && (heroTmdb.backdropUrl || heroTmdb.posterUrl)) || heroFallback;

        return `
          <div style="width:100%; height:100%; background:#070707; padding:40px 60px; overflow-y:auto;" class="no-scrollbar">
            <!-- TOP BAR -->
            <div style="width:100%; height:64px; display:flex; align-items:center; justify-content:space-between;">
              <button id="btn-movie-back" type="button" data-focusable="true" class="tv-focusable movie-pill-btn" style="height:56px; border-radius:28px; background:transparent; border:1px solid #2A2A2A; padding:0 24px; display:flex; align-items:center; gap:12px; color:#FFFFFF; font-size:18px; font-weight:500;">
                ${svgIcon('ArrowBack', 24, '#FFFFFF')}
                <span>Back to Categories</span>
              </button>
              <button id="btn-movie-switch-pl" type="button" data-focusable="true" class="tv-focusable movie-pill-btn" style="margin-left:24px; height:56px; border-radius:28px; background:#141414; border:1px solid #2A2A2A; padding:0 24px; display:flex; align-items:center; gap:12px; color:#FFFFFF; font-size:18px; font-weight:500;">
                ${svgIcon('List', 24, '#A0A0A0')}
                <span>Switch Playlist</span>
              </button>
              <div id="movie-search-box" style="flex:1; margin:0 40px; height:56px; border-radius:28px; background:#141414; border:1px solid transparent; padding:0 24px; display:flex; align-items:center; gap:16px;">
                ${svgIcon('Search', 24, '#A0A0A0')}
                <input id="input-movie-search" data-focusable="true" type="text" value="${escapeHtml(this.searchQuery)}" placeholder="Search movies or series..." style="width:100%; height:100%; color:#FFFFFF; font-size:18px;" />
              </div>
            </div>

            <div style="height:32px;"></div>

            <!-- CATEGORIES ROW -->
            <div style="width:100%; display:flex; gap:16px; overflow-x:auto;" class="no-scrollbar">
              ${categories.map((cat, idx) => {
                const isSel = cat === this.selectedCategory;
                return `
                  <button type="button" data-focusable="true" ${idx === 0 ? 'data-autofocus="true"' : ''} data-movie-cat="${escapeHtml(cat)}" class="tv-focusable movie-cat-btn" style="height:48px; border-radius:24px; background:${isSel ? '#E5141F' : 'transparent'}; border:1px solid ${isSel ? 'transparent' : '#2A2A2A'}; padding:0 24px; display:flex; align-items:center; gap:8px; color:#FFFFFF; font-size:16px; font-weight:${isSel ? '700' : '500'}; flex-shrink:0;">
                    ${cat === 'Featured' ? svgIcon('Star', 18, '#FFFFFF') : ''}
                    <span>${escapeHtml(cat)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <div style="height:32px;"></div>

            <!-- HERO BANNER -->
            ${featured ? `
              <div id="movie-hero-card" data-focusable="true" tabindex="0" class="tv-focusable" style="width:100%; height:500px; border-radius:24px; border:1px solid #2A2A2A; position:relative; overflow:hidden; background:#1E1E1E;">
                ${heroImg ? `<img src="${escapeHtml(heroImg)}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;" />` : ''}
                <div style="position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,0.92) 0%, transparent 75%);"></div>
                <div style="position:absolute; inset:0; background:linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.85) 100%);"></div>

                <div style="position:relative; z-index:2; width:100%; height:100%; padding:50px; display:flex; flex-direction:column; justify-content:center;">
                  <div style="align-self:flex-start; background:rgba(0,0,0,0.6); border-radius:8px; padding:6px 12px; display:flex; align-items:center; gap:6px;">
                    ${svgIcon('Star', 14, '#FFFFFF')}
                    <span style="color:#FFFFFF; font-size:12px; font-weight:700; letter-spacing:1px;">${featured.kind === 'Series' ? 'SERIES' : 'FEATURED'}</span>
                  </div>
                  <div style="height:24px;"></div>
                  <div style="color:#FFFFFF; font-size:64px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(featured.title)}</div>
                  <div style="height:24px;"></div>
                  <div style="display:flex; gap:16px; align-items:center;">
                    ${heroTmdb && heroTmdb.releaseYear ? this.renderMetaTag(escapeHtml(heroTmdb.releaseYear)) : ''}
                    ${this.renderMetaTag(escapeHtml(featured.category))}
                    ${heroTmdb && heroTmdb.rating > 0 ? this.renderMetaTag(`${svgIcon('Star', 14, '#FFD700')} <span>${heroTmdb.rating.toFixed(1)}</span>`) : ''}
                    ${featured.kind === 'Series' ? this.renderMetaTag(`${featured.episodes.length} Episodes`) : ''}
                  </div>
                  <div style="height:24px;"></div>
                  <div style="color:#A0A0A0; font-size:18px; line-height:26px; width:600px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">
                    ${escapeHtml((heroTmdb && heroTmdb.description) || 'No description available for this title.')}
                  </div>
                  <div style="height:40px;"></div>
                  <div style="display:flex;">
                    <div style="background:#E5141F; border-radius:12px; padding:16px 32px; display:flex; align-items:center; gap:12px;">
                      ${svgIcon('PlayArrow', 24, '#FFFFFF')}
                      <span style="color:#FFFFFF; font-size:20px; font-weight:700;">${featured.kind === 'Series' ? 'View Episodes' : 'Watch Now'}</span>
                    </div>
                  </div>
                </div>
              </div>
            ` : ''}

            <div style="height:48px;"></div>

            <!-- CONTINUE WATCHING -->
            ${continueWatching.length > 0 ? `
              <div style="color:#FFFFFF; font-size:24px; font-weight:700;">Continue Watching</div>
              <div style="padding:16px 0 32px 0; display:flex; gap:24px; overflow-x:auto;" class="no-scrollbar">
                ${continueWatching.map((item, idx) => {
                  const img = (item.tmdbDetails && (item.tmdbDetails.backdropUrl || item.tmdbDetails.posterUrl)) || (item.kind === 'Movie' ? item.channel.streamThumbnail : null);
                  const prog = [30, 50, 75, 65][idx % 4];
                  return `
                    <div data-focusable="true" tabindex="0" data-vod-idx="${filtered.indexOf(item)}" class="tv-focusable movie-card-item" style="width:360px; height:200px; border-radius:16px; background:#1E1E1E; border:2px solid #2A2A2A; position:relative; overflow:hidden; flex-shrink:0;">
                      ${img ? `<img src="${escapeHtml(img)}" loading="lazy" style="width:100%; height:100%; object-fit:cover;" />` : `
                        <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:16px; color:#A0A0A0; font-size:18px; text-align:center;">${escapeHtml(item.title)}</div>
                      `}
                      ${item.kind === 'Series' ? `
                        <div style="position:absolute; top:12px; right:12px; background:rgba(229,20,31,0.9); border-radius:6px; padding:4px 8px; color:#FFFFFF; font-size:12px; font-weight:700;">
                          ${item.episodes.length} EP
                        </div>
                      ` : ''}
                      <div style="position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg,transparent,rgba(0,0,0,0.85)); padding:16px;">
                        <div style="width:100%; height:4px; background:#444; border-radius:9999px; overflow:hidden;">
                          <div style="width:${prog}%; height:100%; background:#E5141F; border-radius:9999px;"></div>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}

            <!-- POPULAR TITLES -->
            ${popularMovies.length > 0 ? `
              <div style="color:#FFFFFF; font-size:24px; font-weight:700;">Popular Titles</div>
              <div style="padding:16px 0 60px 0; display:flex; gap:24px; overflow-x:auto;" class="no-scrollbar">
                ${popularMovies.slice(0, 40).map((item, idx) => {
                  const img = (item.tmdbDetails && item.tmdbDetails.posterUrl) || (item.kind === 'Movie' ? item.channel.streamThumbnail : null);
                  return `
                    <div data-focusable="true" tabindex="0" data-vod-idx="${idx}" class="tv-focusable movie-card-item" style="width:220px; height:330px; border-radius:16px; background:#1E1E1E; border:2px solid #2A2A2A; position:relative; overflow:hidden; flex-shrink:0;">
                      ${img ? `<img src="${escapeHtml(img)}" loading="lazy" style="width:100%; height:100%; object-fit:cover;" />` : `
                        <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:16px; color:#A0A0A0; font-size:18px; text-align:center;">${escapeHtml(item.title)}</div>
                      `}
                      ${item.kind === 'Series' ? `
                        <div style="position:absolute; top:12px; right:12px; background:rgba(229,20,31,0.9); border-radius:6px; padding:4px 8px; color:#FFFFFF; font-size:12px; font-weight:700;">
                          SERIES
                        </div>
                      ` : ''}
                      <div style="position:absolute; bottom:0; left:0; right:0; height:100px; background:linear-gradient(180deg,transparent,rgba(0,0,0,0.92)); display:flex; align-items:flex-end; justify-content:center; padding:0 16px 20px 16px;">
                        <div style="color:#FFFFFF; font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center;">${escapeHtml(item.title)}</div>
                      </div>

      bindApiKeyEvents() {
        const back = document.getElementById('btn-ytapi-back');
        if (back) back.addEventListener('click', () => AppRouter.handleBack());
        const input = document.getElementById('input-ytapi-key');
        if (input) {
          input.addEventListener('input', (e) => { this.apiKeyInput = e.target.value; });
          input.addEventListener('focus', () => {
            const box = document.getElementById('ytapi-field-box');
            if (box) box.style.borderColor = '#E5141F';
          });
          input.addEventListener('blur', () => {
            const box = document.getElementById('ytapi-field-box');
            if (box) box.style.borderColor = '#2C2C35';
          });
        }
        const eye = document.getElementById('btn-ytapi-eye');
        if (eye) eye.addEventListener('click', () => { this.passwordVisible = !this.passwordVisible; AppRouter.render(); });
        const save = document.getElementById('btn-ytapi-save');
        if (save) {
          save.addEventListener('click', () => {
            const key = this.apiKeyInput.trim() || 'CURATED_WEB_KEY';
            IptvViewModel.saveYoutubeApiKey(key);
            AppRouter.navigate('youtubeMain');
          });
        }
        const how = document.getElementById('btn-ytapi-how');
        if (how) how.addEventListener('click', () => showToast('Follow the 5 steps below in Google Cloud Console'));
      },

      bindMainEvents() {
        const back1 = document.getElementById('btn-ytmain-back');
        if (back1) back1.addEventListener('click', () => AppRouter.handleBack());
        const back2 = document.getElementById('btn-ytsearch-back');
        if (back2) back2.addEventListener('click', () => { this.isSearchMode = false; AppRouter.render(); });

        const sMain = document.getElementById('input-ytmain-search');
        if (sMain) {
          sMain.addEventListener('input', (e) => { this.searchQuery = e.target.value; });
          sMain.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.keyCode === 13) {
              this.isSearchMode = true;
              IptvViewModel.searchYoutube(this.searchQuery || 'relaxing nature 4k');
            }
          });
        }

        const sSearch = document.getElementById('input-yt-search');
        if (sSearch) {
          sSearch.addEventListener('input', (e) => {
            this.searchQuery = e.target.value;
            IptvViewModel.searchYoutube(this.searchQuery);
          });
        }

        const clearBtn = document.getElementById('btn-yt-clear');
        if (clearBtn) clearBtn.addEventListener('click', () => { this.searchQuery = ''; AppRouter.render(); });

        const micMain = document.getElementById('btn-ytmain-mic');
        if (micMain) micMain.addEventListener('click', () => { this.isSearchMode = true; AppRouter.render(); });
        const micSearch = document.getElementById('btn-yt-mic');
        if (micSearch) micSearch.addEventListener('click', () => showToast('Voice Search'));

        const bell1 = document.getElementById('btn-ytmain-bell');
        if (bell1) bell1.addEventListener('click', () => showToast('No new notifications'));
        const bell2 = document.getElementById('btn-yt-bell');
        if (bell2) bell2.addEventListener('click', () => showToast('Notifications'));

        const prof1 = document.getElementById('btn-ytmain-profile');
        if (prof1) prof1.addEventListener('click', () => AppRouter.navigate('settings'));
        const prof2 = document.getElementById('btn-yt-profile');
        if (prof2) prof2.addEventListener('click', () => showToast('Profile'));

        const filt = document.getElementById('btn-yt-filters');
        if (filt) filt.addEventListener('click', () => showToast('Filters'));

        document.querySelectorAll('[data-yt-cat]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.selectedCategory = btn.getAttribute('data-yt-cat');
            IptvViewModel.fetchYoutubeData(this.selectedCategory);
          });
        });

        document.querySelectorAll('[data-yt-scat]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.selectedSearchCat = btn.getAttribute('data-yt-scat');
            AppRouter.render();
          });
        });

        const heroVideo = IptvViewModel.youtubeTrending[0] || FALLBACK_YOUTUBE_VIDEOS[0];
        const heroPlay = document.getElementById('btn-ythero-play');
        if (heroPlay) heroPlay.addEventListener('click', () => AppRouter.navigate(`youtubePlayer/${heroVideo.videoId}`));
        const heroInfo = document.getElementById('btn-ythero-info');
        if (heroInfo) heroInfo.addEventListener('click', () => { this.showMoreInfoDialog = true; AppRouter.render(); });
        const closeHeroInfo = document.getElementById('btn-close-ythero-info');
        if (closeHeroInfo) closeHeroInfo.addEventListener('click', () => { this.showMoreInfoDialog = false; AppRouter.render(); });

        document.querySelectorAll('.yt-video-card').forEach(card => {
          card.addEventListener('focus', () => {
            card.style.borderColor = '#FFFFFF';
            card.style.background = '#272727';
          });
          card.addEventListener('blur', () => {
            card.style.borderColor = 'transparent';
            card.style.background = 'transparent';
          });
          card.addEventListener('click', () => {
            const vid = card.getAttribute('data-yt-vid');
            if (vid) AppRouter.navigate(`youtubePlayer/${vid}`);
          });
        });
      },

      bindPlayerEvents() {
        const back = document.getElementById('btn-ytplayer-back');
        if (back) back.addEventListener('click', () => AppRouter.handleBack());
      }
    };
