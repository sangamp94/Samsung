      bindSettingsEvents() {
        if (!this.showAdvancedSettings) {
          const back = document.getElementById('btn-lang-back');
          if (back) back.addEventListener('click', () => AppRouter.handleBack());
          const adv = document.getElementById('btn-lang-advanced');
          if (adv) {
            adv.addEventListener('focus', () => { adv.style.borderColor = '#FF0033'; });
            adv.addEventListener('blur', () => { adv.style.borderColor = 'transparent'; });
            adv.addEventListener('click', () => {
              this.showAdvancedSettings = true;
              AppRouter.render();
            });
          }
          document.querySelectorAll('.lang-card-item').forEach(card => {
            card.addEventListener('focus', () => {
              card.style.borderColor = '#FF0033';
              card.style.borderWidth = '4px';
            });
            card.addEventListener('blur', () => {
              const code = card.getAttribute('data-lang-code');
              const isSel = code === Translator.languageCode;
              card.style.borderColor = isSel ? '#FF0033' : 'rgba(255,0,51,0.2)';
              card.style.borderWidth = isSel ? '3px' : '2px';
            });
            card.addEventListener('click', () => {
              const code = card.getAttribute('data-lang-code');
              Translator.setLanguage(code);
              showToast(`Language set to ${code.toUpperCase()}`);
              AppRouter.render();
            });
          });
        } else {
          const c1 = document.getElementById('btn-set-cat-pl');
          if (c1) c1.addEventListener('click', () => { this.selectedCategory = 'Playlist'; AppRouter.render(); });
          const c2 = document.getElementById('btn-set-cat-mgmt');
          if (c2) c2.addEventListener('click', () => { this.selectedCategory = 'PlaylistManagement'; AppRouter.render(); });

          const refBtn = document.getElementById('btn-set-refresh-pl');
          if (refBtn) refBtn.addEventListener('click', () => IptvViewModel.refreshPlaylists());
          const mgmtBtn = document.getElementById('btn-set-manage-pl');
          if (mgmtBtn) mgmtBtn.addEventListener('click', () => showToast('Please go to the main menu and use the MANAGE PLAYLISTS tab.'));

          const colBtn = document.getElementById('btn-set-collections');
          if (colBtn) colBtn.addEventListener('click', () => AppRouter.navigate('collection_builder'));
          const scanBtn = document.getElementById('btn-set-scanner');
          if (scanBtn) scanBtn.addEventListener('click', () => AppRouter.navigate('scanner'));
          const stuBtn = document.getElementById('btn-set-student');
          if (stuBtn) stuBtn.addEventListener('click', () => AppRouter.navigate('student_mode'));
          const langBtn = document.getElementById('btn-set-lang');
          if (langBtn) {
            langBtn.addEventListener('click', () => {
              const langs = ['en', 'hi', 'bn', 'te', 'ta', 'kn'];
              const next = langs[(langs.indexOf(Translator.languageCode) + 1) % langs.length];
              Translator.setLanguage(next);
              AppRouter.render();
            });
          }
          const themeBtn = document.getElementById('btn-set-theme');
          if (themeBtn) themeBtn.addEventListener('click', () => IptvViewModel.setDarkMode(!IptvViewModel.isDarkMode));
          const resetBtn = document.getElementById('btn-set-reset');
          if (resetBtn) {
            resetBtn.addEventListener('click', async () => {
              IptvViewModel.savedPlaylists = [];
              await AppDB.setItem('saved_playlists', []);
              await IptvViewModel.loadChannelsFromDatabase();
              showToast('Application playlists reset');
              AppRouter.navigate('input');
            });
          }

          const backOld = document.getElementById('btn-oldset-back');
          if (backOld) {
            backOld.addEventListener('click', () => {
              this.showAdvancedSettings = false;
              AppRouter.render();
            });
          }

          document.querySelectorAll('.settings-top-card, .settings-action-btn').forEach(btn => {
            btn.addEventListener('focus', () => { btn.style.borderColor = '#FFFFFF'; });
            btn.addEventListener('blur', () => { btn.style.borderColor = 'transparent'; });
          });
        }
      },

      bindCollectionEvents() {
        const input = document.getElementById('input-col-name');
        if (input) input.addEventListener('input', (e) => { this.newCollectionName = e.target.value; });
        const pasteBtn = document.getElementById('btn-col-paste');
        if (pasteBtn) {
          pasteBtn.addEventListener('click', async () => {
            try {
              const t = await navigator.clipboard.readText();
              if (t) { this.newCollectionName = t; AppRouter.render(); }
            } catch (e) {}
          });
        }
        const addBtn = document.getElementById('btn-col-add');
        if (addBtn) {
          addBtn.addEventListener('click', async () => {
            if (this.newCollectionName.trim()) {
              await IptvViewModel.addCollection(this.newCollectionName);
              this.newCollectionName = '';
              AppRouter.render();
            }
          });
        }
        document.querySelectorAll('[data-del-col]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-del-col');
            const col = IptvViewModel.collections.find(c => c.id === id);
            if (col) {
              await IptvViewModel.deleteCollection(col);
              AppRouter.render();
            }
          });
        });
        const done = document.getElementById('btn-col-done');
        if (done) done.addEventListener('click', () => AppRouter.handleBack());
      },

      bindScannerEvents() {
        const rescan = document.getElementById('btn-scanner-rescan');
        if (rescan) {
          rescan.addEventListener('click', () => {
            const fInput = document.getElementById('hidden-scanner-video-input');
            if (fInput) fInput.click();
          });
        }
        document.querySelectorAll('[data-scan-vid]').forEach(row => {
          row.addEventListener('click', () => {
            const id = Number(row.getAttribute('data-scan-vid'));
            const v = this.scannedVideos.find(x => x.id === id);
            if (v) { v.selected = !v.selected; AppRouter.render(); }
          });
        });
        const cancel = document.getElementById('btn-scanner-cancel');
        if (cancel) cancel.addEventListener('click', () => AppRouter.handleBack());
        const add = document.getElementById('btn-scanner-add');
        if (add) {
          add.addEventListener('click', async () => {
            const selected = this.scannedVideos.filter(v => v.selected);
            if (selected.length > 0) {
              let col = IptvViewModel.collections.find(c => c.name === 'Local Videos');
              if (!col) col = await IptvViewModel.addCollection('Local Videos');
              for (const v of selected) {
                await IptvViewModel.addItemToCollection({
                  id: 'loc_' + v.id,
                  collectionId: col.id,
                  name: v.name,
                  url: v.uri,
                  category: 'Local Videos',
                  type: 'Video',
                  addDate: Date.now()
                });
              }
              showToast(`Added ${selected.length} video(s) to Local Videos`);
              AppRouter.handleBack();
            } else {
              showToast('Select at least one video');
            }
          });
        }
      },

      bindStudentEvents() {
        const toggle = document.getElementById('btn-student-toggle');
        if (toggle) {
          toggle.addEventListener('click', async () => {
            IptvViewModel.appConfig.studentModeEnabled = !IptvViewModel.appConfig.studentModeEnabled;
            await AppDB.setItem('app_config', IptvViewModel.appConfig);
            AppRouter.render();
          });
        }
        const pinIn = document.getElementById('input-student-pin');
        if (pinIn) pinIn.addEventListener('input', (e) => { this.pinInput = e.target.value; });
        const done = document.getElementById('btn-student-done');
        if (done) done.addEventListener('click', () => AppRouter.handleBack());
        const save = document.getElementById('btn-student-save');
        if (save) {
          save.addEventListener('click', async () => {
            if (this.pinInput.trim()) {
              IptvViewModel.appConfig.pinHash = this.pinInput.trim();
              await AppDB.setItem('app_config', IptvViewModel.appConfig);
              this.pinInput = '';
              showToast('Student Mode PIN saved');
              AppRouter.handleBack();
            }
          });
        }
      }
    };

    // =========================================================================
    // 23. APP ROUTER & LIFECYCLE CONTROLLER (Exact Port of MainActivity.kt NavHost)
    // =========================================================================
    const AppRouter = {
      phase: 'TOKEN_GATE', // TOKEN_GATE, CRASH_DIALOG, SPLASH, DISCLAIMER, NAV_HOST
      currentRoute: 'input',
      historyStack: [],

      async startApp() {
        StageScaler.update();
        TvFullscreenManager.init();
        TvSpatialNav.init();
        this.initBrowserBackGuard();
        this.bindGlobalFileInputs();
        await IptvViewModel.init();
        await TokenGateController.checkRemoteConfigAndInit();
      },

      initBrowserBackGuard() {
        try {
          window.history.pushState({ streamifyGuard: true }, '');
          window.addEventListener('popstate', () => {
            try { window.history.pushState({ streamifyGuard: true }, ''); } catch (e) {}
            this.handleBack();
          });
        } catch (e) {}
      },

      onTokenVerified() {
        const lastCrash = SafePrefs.get('last_crash', null);
        if (lastCrash) {
          this.phase = 'CRASH_DIALOG';
          this.render();
          return;
        }
        this.startSplashPhase();
      },

      startSplashPhase() {
        this.phase = 'SPLASH';
        this.render();
        SplashScreenController.start(() => {
          const accepted = SafePrefs.get('has_accepted_disclaimer', false);
          if (!accepted) {
            this.phase = 'DISCLAIMER';
            this.render();
          } else {
            this.enterNavHost();
          }
        });
      },

      enterNavHost() {
        this.phase = 'NAV_HOST';
        const lastWatchedId = SafePrefs.get('last_watched_channel_id', null);
        const hasValidLast = lastWatchedId && IptvViewModel.allChannels.some(c => c.id === lastWatchedId);
        if (IptvViewModel.hasPlaylist === true) {
          if (hasValidLast) {
            const ch = IptvViewModel.allChannels.find(c => c.id === lastWatchedId);
            IptvViewModel.playChannel(ch.url, 0, ch);
            this.currentRoute = `player/${lastWatchedId}`;
          } else {
            this.currentRoute = 'selector';
          }
        } else {
          this.currentRoute = 'input';
        }
        this.historyStack = [];
        this.render();
      },

      navigate(route, replace = false) {
        if (this.currentRoute.startsWith('player/') && !route.startsWith('player/')) {
          PlayerOverlayController.cleanup();
        }
        if (!replace && this.currentRoute !== route) {
          this.historyStack.push(this.currentRoute);
        }
        this.currentRoute = route;
        if (route.startsWith('player/')) {
          const chId = route.split('/')[1];
          PlayerOverlayController.initForChannelId(chId);
        }
        this.render();
      },

      handleBack() {
        if (this.phase !== 'NAV_HOST') return;

        // Screen-specific BackHandlers matching Compose BackHandler priority
        if (this.currentRoute === 'list') {
          if (TvListController.panelState === 'HIDDEN') {
            TvListController.panelState = 'CHANNELS';
            this.render();
            return;
          }
          if (TvListController.panelState === 'CHANNELS') {
            TvListController.panelState = 'CATEGORIES';
            TvListController.focusedIndex = 0;
            TvListController.renderVirtualItems(true);
            return;
          }
        }

        if (this.currentRoute.startsWith('player/')) {
          if (PlayerOverlayController.showCastDialog || PlayerOverlayController.showSubtitlesDialog || PlayerOverlayController.showEpisodesDialog) {
            PlayerOverlayController.showCastDialog = false;
            PlayerOverlayController.showSubtitlesDialog = false;
            PlayerOverlayController.showEpisodesDialog = false;
            PlayerOverlayController.updateOverlayDom();
            return;
          }
          if (PlayerOverlayController.isOverlayVisible) {
            PlayerOverlayController.isOverlayVisible = false;
            PlayerOverlayController.updateOverlayDom();
            return;
          }
          PlayerOverlayController.cleanup();
        }

        if (this.currentRoute === 'youtubeMain' && YouTubeScreensController.isSearchMode) {
          YouTubeScreensController.isSearchMode = false;
          YouTubeScreensController.searchQuery = '';
          this.render();
          return;
        }

        if (this.currentRoute === 'settings' && SettingsAndFeaturesController.showAdvancedSettings) {
          SettingsAndFeaturesController.showAdvancedSettings = false;
          this.render();
          return;
        }

        if (this.historyStack.length > 0) {
          const prev = this.historyStack.pop();
          this.currentRoute = prev;
          this.render();
        } else if (this.currentRoute !== 'input') {
          this.currentRoute = 'selector';
          this.render();
        }
      },

      notifyPlayerState() {
        if (this.currentRoute.startsWith('player/')) {
          PlayerOverlayController.updateOverlayDom();
        }
      },

      bindGlobalFileInputs() {
        const m3uFileIn = document.getElementById('hidden-m3u-file-input');
        if (m3uFileIn) {
          m3uFileIn.addEventListener('change', async (e) => {
            const f = e.target.files && e.target.files[0];
            if (f) {
              M3uInputController.localFileName = f.name;
              M3uInputController.localFileContent = typeof f.text === 'function'
                ? await f.text()
                : await new Promise((res) => {
                    const reader = new FileReader();
                    reader.onload = () => res(String(reader.result || ''));
                    reader.onerror = () => res('');
                    reader.readAsText(f);
                  });
              this.render();
            }
          });
        }
        const vidFileIn = document.getElementById('hidden-local-video-input');
        if (vidFileIn) {
          vidFileIn.addEventListener('change', (e) => {
            const files = Array.from(e.target.files || []);
            if (files.length > 0) {
              M3uInputController.selectedLocalVideos = files.map(f => ({
                uri: URL.createObjectURL(f),
                name: f.name,
                category: 'Local Videos'
              }));
              this.render();
            }
          });
        }
        const scanFileIn = document.getElementById('hidden-scanner-video-input');
        if (scanFileIn) {
          scanFileIn.addEventListener('change', (e) => {
            const files = Array.from(e.target.files || []);
            files.forEach((f, idx) => {
              SettingsAndFeaturesController.scannedVideos.unshift({
                id: Date.now() + idx,
                name: f.name,
                uri: URL.createObjectURL(f),
                size: f.size || (50 * 1024 * 1024),
                selected: true
              });
            });
            this.render();
          });
        }
      },

      render() {
        const mount = document.getElementById('app-mount');
        if (!mount) return;

        // Detach shared video element before wiping mount innerHTML so playback state stays alive
        if (this.phase !== 'NAV_HOST' || (!this.currentRoute.startsWith('player/') && this.currentRoute !== 'list')) {
          IptvViewModel.detachVideo();
        } else {
          IptvViewModel.detachVideo();
        }

        if (this.phase === 'TOKEN_GATE') {
          mount.innerHTML = TokenGateController.render();
          TokenGateController.bindEvents();
          setTimeout(() => TvSpatialNav.focusFirstAvailable(), 20);
          return;
        }

        if (this.phase === 'CRASH_DIALOG') {
          const st = SafePrefs.get('last_crash', 'Unknown stacktrace');
          mount.innerHTML = CrashAndDisclaimerController.renderCrash(st);
          const copyBtn = document.getElementById('btn-copy-crash');
          if (copyBtn) {
            copyBtn.addEventListener('click', () => {
              try { navigator.clipboard.writeText(st); } catch (e) {}
              CrashAndDisclaimerController.copied = true;
              this.render();
            });
          }
          const clearBtn = document.getElementById('btn-clear-crash');
          if (clearBtn) {
            clearBtn.addEventListener('click', () => {
              SafePrefs.remove('last_crash');
              this.startSplashPhase();
            });
          }
          setTimeout(() => TvSpatialNav.focusFirstAvailable(), 20);
          return;
        }

        if (this.phase === 'SPLASH') {
          mount.innerHTML = SplashScreenController.render();
          return;
        }

        if (this.phase === 'DISCLAIMER') {
          mount.innerHTML = CrashAndDisclaimerController.renderDisclaimer();
          const accBtn = document.getElementById('btn-accept-disclaimer');
          if (accBtn) {
            accBtn.addEventListener('click', () => {
              SafePrefs.set('has_accepted_disclaimer', true);
              this.enterNavHost();
            });
          }
          setTimeout(() => TvSpatialNav.focusFirstAvailable(), 20);
          return;
        }

        // NAV_HOST Routes
        const r = this.currentRoute;
        if (r === 'input') {
          mount.innerHTML = M3uInputController.render();
          M3uInputController.bindEvents();
        } else if (r === 'selector') {
          mount.innerHTML = ContentTypeSelectorController.render();
          ContentTypeSelectorController.bindEvents();
        } else if (r === 'list') {
          mount.innerHTML = TvListController.render();
          TvListController.bindEvents();
        } else if (r.startsWith('player/')) {
          mount.innerHTML = PlayerOverlayController.render();
          PlayerOverlayController.bindEvents();
        } else if (r === 'movies') {
          mount.innerHTML = MovieScreenController.render();
          MovieScreenController.bindEvents();
        } else if (r === 'seriesDetails') {
          mount.innerHTML = SeriesDetailsController.render();
          SeriesDetailsController.bindEvents();
        } else if (r === 'youtubeApi') {
          mount.innerHTML = YouTubeScreensController.renderApiKeyScreen();
          YouTubeScreensController.bindApiKeyEvents();
        } else if (r === 'youtubeMain') {
          mount.innerHTML = YouTubeScreensController.renderMainOrSearchScreen();
          YouTubeScreensController.bindMainEvents();
        } else if (r.startsWith('youtubePlayer/')) {
          const vid = r.split('/')[1];
          mount.innerHTML = YouTubeScreensController.renderPlayerScreen(vid);
          YouTubeScreensController.bindPlayerEvents();
        } else if (r === 'settings') {
          mount.innerHTML = SettingsAndFeaturesController.renderSettings();
          SettingsAndFeaturesController.bindSettingsEvents();
        } else if (r === 'collection_builder') {
          mount.innerHTML = SettingsAndFeaturesController.renderCollectionBuilder();
          SettingsAndFeaturesController.bindCollectionEvents();
        } else if (r === 'scanner') {
          mount.innerHTML = SettingsAndFeaturesController.renderLocalScanner();
          SettingsAndFeaturesController.bindScannerEvents();
        } else if (r === 'student_mode') {
          mount.innerHTML = SettingsAndFeaturesController.renderStudentMode();
          SettingsAndFeaturesController.bindStudentEvents();
        }

        setTimeout(() => TvSpatialNav.focusFirstAvailable(), 25);
      }
    };

    // Start Clock Ticker for M3uInputScreen
    setInterval(() => {
      const tEl = document.getElementById('m3u-clock-time');
      const dEl = document.getElementById('m3u-clock-date');
      if (tEl && dEl) {
        const { timeStr, dateStr } = M3uInputController.formatClock();
        tEl.textContent = timeStr;
        dEl.textContent = dateStr;
      }
    }, 1000);

    window.addEventListener('load', () => {
      AppRouter.startApp();
    });
  </script>
</body>
</html>
